name: amine-co2-uq
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - rdkit
  - lightgbm
  - scikit-learn
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - optuna
  - python-dotenv
  - pip
  - pip:
      - ngboost
      - mapie
      - chemprop
      - neo4j
      # Quantum extras (PennyLane, qiskit) — add only when Phase 6 (quantum ablation) starts.
variables:
  # MKL's default OpenMP layer is missing on Windows and crashes LAPACK; TBB works.
  MKL_THREADING_LAYER: TBB
